<app-layout>
    <div class="app-page result-page">

        <header class="app-header" data-cy="app-header">
            <h1 data-cy="result-title">{{ langService.texts.resultTitle }}</h1>
        </header>

        <main class="app-main" data-cy="app-main">
            <div class="result-box" data-cy="result-bux">
                <p class="guide-text" data-cy="guide-text">{{ langService.texts.resultSubtitle }}</p>
                <div class="result-number" data-cy="result-number">{{ result }}</div>
                <button data-cy="restrat-btn" (click)="restart()">
                    {{ langService.texts.restart }}
                </button>
            </div>
        </main>

        <footer class="app-footer" data-cy="app-footer">
            {{ langService.texts.footer }}
        </footer>

    </div>
</app-layout>
