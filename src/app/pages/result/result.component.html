<app-layout>
    <div class="app-page result-page">

        <header class="app-header">
            <h1>{{ langService.texts.resultTitle }}</h1>
        </header>

        <main class="app-main">
            <div class="result-box">
                <p class="guide-text">{{ langService.texts.resultSubtitle }}</p>
                <div class="result-number">{{ result }}</div>
                <button (click)="restart()">
                    {{ langService.texts.restart }}
                </button>
            </div>
        </main>

        <footer class="app-footer">
            {{ langService.texts.footer }}
        </footer>

    </div>
</app-layout>
