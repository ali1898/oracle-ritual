<app-layout>
    <div class="page-shell">

        <header class="page-header" data-cy="setup-header">
            <h1 data-cy="setup-title">{{ langService.texts.title }}</h1>
            <p data-cy="setup-subtitle" class="subtitle">{{ langService.texts.subtitle }}</p>
        </header>

        <main class="page-content" data-cy="setup-main">

            <button data-cy="setup-start-btn" class="primary-btn" (click)="startGame(2)">
                {{ langService.texts.selectANumber }}
            </button>
        </main>

        <footer class="page-footer" data-cy="setup-footer">
            {{ langService.texts.footer }}
        </footer>

    </div>
</app-layout>
