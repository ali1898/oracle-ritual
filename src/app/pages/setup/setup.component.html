<app-layout>
    <div class="page-shell">

        <header class="page-header">
            <h1>{{ langService.texts.title }}</h1>
        </header>

        <main class="page-content">
            <p class="subtitle">{{ langService.texts.subtitle }}</p>

            <button class="primary-btn" (click)="startGame(2)">
                {{ langService.texts.selectANumber }}
            </button>
        </main>

        <footer class="page-footer">
            {{ langService.texts.footer }}
        </footer>

    </div>
</app-layout>
